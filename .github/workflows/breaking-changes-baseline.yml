name: API Baseline Updater

on:
    push:
        branches: [ "1.*" ]

permissions:
    contents: write
    pull-requests: write

# should hopefully cancel current actions when a newer one happens
concurrency:
    group: build-${{ github.ref_name }}
    cancel-in-progress: true

jobs:
    baseline-updater:

        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v5

            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: '25'

            -   name: Setup gradle
                uses: gradle/actions/setup-gradle@v5

            -   run: chmod +x gradlew
            -   name: Build
                run: ./gradlew build

            -   name: Build with Gradle
                run: ./gradlew updateKotlinAbi || true

            -   name: Check for breaking changes
                run: |
                    if ! $(git diff --exit-code versions/26.1/api/26.1.api) || ! $(git diff --exit-code versions/26.2/api/26.2.api) || ! $(git diff --exit-code versions/26.3/api/26.3.api);
                    then
                        git config --global user.email "meowtomation@users.noreply.github.com"
                        git config --global user.name "meowtomation"
                        git add .
                        git commit -m "update api dump"
                        git push
                    fi
